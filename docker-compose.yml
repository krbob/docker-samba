services:
  samba:
    build: .
    container_name: samba
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Europe/Warsaw
      SHARE_NAME: public
      # Set SAMBA_PASSWORD, SAMBA_PASSWORD_FILE, or GUEST_OK.
      # SAMBA_PASSWORD: "replace-with-a-strong-password"
      # SAMBA_PASSWORD_FILE: /run/secrets/samba_password
      WORKGROUP: WORKGROUP
      SERVER_STRING: Home Lab NAS
      FORCE_USER_UID: "1000"
      FORCE_GROUP_GID: "1000"
      # SHARE_DIR_MODE: "0777"
      # READ_ONLY: "1"
      # CREATE_MASK: "0664"
      # DIRECTORY_MASK: "0775"
      # RECYCLE_ENABLE: "1"
      # RECYCLE_REPOSITORY: ".recycle"
      # RECYCLE_MAX_SIZE: "0"
      # RECYCLE_EXCLUDE: "*.tmp|*.temp"
      # RECYCLE_EXCLUDE_DIR: ".recycle|tmp"
      LOG_LEVEL: "1"
      # Restrict smbd listeners. Include lo if SAMBA_BIND_INTERFACES_ONLY=1 so healthcheck works.
      # SAMBA_INTERFACES: "lo eno1"
      # SAMBA_BIND_INTERFACES_ONLY: "1"
      # SAMBA_HOSTS_ALLOW: "192.168.1.0/24 10.13.13.0/24 127.0.0.0/8"
      # WSDD2_ENABLE: "1"
      # WSDD2_HOSTNAME: "homelab"
      # WSDD2_NETBIOS_NAME: "HOMELAB"
      # AVAHI_ENABLE: "1"
      # ALLOWED_INTERFACES: "eno1"
      # Security-sensitive: enables Samba wide links outside SHARE_PATH inside the container.
      # FOLLOW_SYMLINKS: "1"
      # GUEST_OK: "1"
    volumes:
      - samba-data:/share
    # secrets:
    #   - samba_password

volumes:
  samba-data:
    driver: local

# secrets:
#   samba_password:
#     file: ./samba_password.txt
