name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  BINFMT_IMAGE: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  BUILDKIT_IMAGE: moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
  HADOLINT_IMAGE: hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e
  SBOM_SCANNER_IMAGE: docker/buildkit-syft-scanner:stable-1@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
  SHELLCHECK_IMAGE: koalaman/shellcheck:stable@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d
  TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f

jobs:
  quality:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            "$ACTIONLINT_IMAGE"

      - name: Lint shell scripts
        run: |
          docker run --rm \
            -v "$PWD:/mnt:ro" \
            -w /mnt \
            "$SHELLCHECK_IMAGE" \
              etc/cont-init.d/01-samba-init \
              etc/samba-healthcheck \
              etc/services.d/smbd/run \
              etc/services.d/wsdd/run \
              etc/services.d/avahi/run \
              tests/smoke.sh

      - name: Lint Dockerfile
        run: |
          docker run --rm -i "$HADOLINT_IMAGE" \
            /bin/hadolint --ignore DL3008 - < Dockerfile

      - name: Validate Compose files
        env:
          SAMBA_LAN_INTERFACE: eth0
          SAMBA_LAN_NETWORK: 192.0.2.0/24
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose-test.yml config --quiet
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            config --quiet
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.guest.yml \
            config --quiet
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.discovery.yml \
            config --quiet

  test-local:
    name: Build and test without publishing
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Build amd64 test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: local/samba:test
          build-args: |
            IMAGE_VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=samba-image-amd64
          cache-to: type=gha,mode=max,scope=samba-image-amd64,ignore-error=true

      - name: Run Samba smoke tests
        run: bash tests/smoke.sh

      - name: Export image for socketless vulnerability scanning
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker image save --output "$RUNNER_TEMP/samba-image.tar" local/samba:test

      - name: Gate on fixable HIGH and CRITICAL vulnerabilities
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/samba-image.tar:/image.tar:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --input /image.tar \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --scanners vuln \
              --pkg-types os \
              --no-progress

      - name: Report all HIGH and CRITICAL vulnerabilities
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/samba-image.tar:/image.tar:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --input /image.tar \
              --exit-code 0 \
              --severity HIGH,CRITICAL \
              --scanners vuln \
              --pkg-types os \
              --no-progress

      - name: Build arm64 runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: local/samba:arm64-test
          build-args: |
            IMAGE_VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=samba-image-arm64
          cache-to: type=gha,mode=max,scope=samba-image-arm64,ignore-error=true

      # This is intentionally last: smoke.sh retags the selected image as
      # local/samba:test for the fixed Compose test fixture.
      - name: Run minimal arm64 smoke tests through QEMU
        env:
          SAMBA_SMOKE_SCOPE: minimal
          SAMBA_TEST_IMAGE: local/samba:arm64-test
        run: bash tests/smoke.sh

  publish:
    name: Build once, test digest, and promote
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set image references
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/samba"
          candidate="${image}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          full_sha="${image}:sha-${GITHUB_SHA}"
          {
            echo "image=${image}"
            echo "candidate=${candidate}"
            echo "full_sha=${full_sha}"
            echo "latest=${image}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      # A registry-backed candidate is intentional. The classic Docker image store
      # cannot load a multi-platform index with attestations. Keeping this immutable
      # candidate tag also leaves an audit trail for a build that failed validation.
      - name: Build and push multiarch candidate once
        id: candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: generator=${{ env.SBOM_SCANNER_IMAGE }}
          provenance: mode=max
          tags: ${{ steps.image.outputs.candidate }}
          build-args: |
            IMAGE_VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=samba-image-multiarch
          cache-to: type=gha,mode=max,scope=samba-image-multiarch,ignore-error=true

      - name: Resolve and pull the exact amd64 candidate artifact
        id: platforms
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          test -n "$DIGEST"
          candidate_ref="${IMAGE}@${DIGEST}"
          manifest="$(docker buildx imagetools inspect "$candidate_ref" --format '{{json .Manifest}}')"
          echo "$manifest" | jq .
          echo "$manifest" | jq -e \
            '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")' >/dev/null
          echo "$manifest" | jq -e \
            '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")' >/dev/null
          amd64_digest="$(echo "$manifest" | jq -er \
            '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')"
          arm64_digest="$(echo "$manifest" | jq -er \
            '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')"
          {
            echo "amd64_digest=${amd64_digest}"
            echo "arm64_digest=${arm64_digest}"
          } >> "$GITHUB_OUTPUT"
          docker pull "${IMAGE}@${amd64_digest}"
          docker tag "${IMAGE}@${amd64_digest}" local/samba:test
          test "$(docker image inspect -f '{{.Architecture}}' local/samba:test)" = "amd64"

      - name: Run Samba smoke tests against the candidate digest
        run: bash tests/smoke.sh

      - name: Export image for socketless vulnerability scanning
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker image save --output "$RUNNER_TEMP/samba-image.tar" local/samba:test

      - name: Gate on fixable HIGH and CRITICAL vulnerabilities
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/samba-image.tar:/image.tar:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --input /image.tar \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --scanners vuln \
              --pkg-types os \
              --no-progress

      - name: Report all HIGH and CRITICAL vulnerabilities
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/samba-image.tar:/image.tar:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --input /image.tar \
              --exit-code 0 \
              --severity HIGH,CRITICAL \
              --scanners vuln \
              --pkg-types os \
              --no-progress

      - name: Pull exact arm64 image from the validated candidate
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          PLATFORM_DIGEST: ${{ steps.platforms.outputs.arm64_digest }}
        run: |
          docker pull "${IMAGE}@${PLATFORM_DIGEST}"
          docker tag "${IMAGE}@${PLATFORM_DIGEST}" local/samba:arm64-test
          test "$(docker image inspect -f '{{.Architecture}}' local/samba:arm64-test)" = "arm64"

      # This runs after every amd64 assertion. smoke.sh retags its selected
      # arm64 image as local/samba:test, so no amd64-dependent step follows it.
      - name: Run minimal arm64 smoke tests through QEMU
        env:
          SAMBA_SMOKE_SCOPE: minimal
          SAMBA_TEST_IMAGE: local/samba:arm64-test
        run: bash tests/smoke.sh

      - name: Promote the validated manifest without rebuilding
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
          FULL_SHA: ${{ steps.image.outputs.full_sha }}
          LATEST: ${{ steps.image.outputs.latest }}
        run: |
          source_ref="${IMAGE}@${DIGEST}"
          docker buildx imagetools create \
            --tag "$FULL_SHA" \
            --tag "$LATEST" \
            "$source_ref"

          for promoted_ref in "$FULL_SHA" "$LATEST"; do
            promoted_digest="$(docker buildx imagetools inspect "$promoted_ref" --format '{{.Manifest.Digest}}')"
            if [ "$promoted_digest" != "$DIGEST" ]; then
              echo "Expected $promoted_ref to resolve to $DIGEST, got $promoted_digest" >&2
              exit 1
            fi
          done

  test:
    name: test
    if: ${{ always() }}
    needs:
      - quality
      - test-local
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify the event-specific test path
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          LOCAL_RESULT: ${{ needs.test-local.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          test "$QUALITY_RESULT" = success
          if [ "$EVENT_NAME" = push ] && [ "$EVENT_REF" = refs/heads/main ]; then
            test "$PUBLISH_RESULT" = success
            test "$LOCAL_RESULT" = skipped
          else
            test "$LOCAL_RESULT" = success
            test "$PUBLISH_RESULT" = skipped
          fi
