name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lint shell scripts
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            etc/cont-init.d/01-samba-init \
            etc/samba-healthcheck \
            etc/services.d/smbd/run \
            etc/services.d/wsdd/run \
            etc/services.d/avahi/run

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 /bin/hadolint --ignore DL3008 - < Dockerfile

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/samba:test
          cache-from: type=gha,scope=samba-image
          cache-to: type=gha,mode=max,scope=samba-image,ignore-error=true

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.72.0 image \
              --exit-code 1 \
              --severity CRITICAL \
              --ignore-unfixed \
              --scanners vuln \
              --pkg-types os \
              --no-progress \
              local/samba:test

      - name: Start test container
        run: docker compose -f docker-compose-test.yml up -d --no-build

      - name: Wait for container to be healthy
        run: |
          echo "Waiting for Samba to start..."
          for i in $(seq 1 30); do
            HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' samba-test)
            if [ "$HEALTH" = "healthy" ]; then
              echo "Samba is ready"
              exit 0
            fi
            if [ "$HEALTH" = "unhealthy" ]; then
              echo "Samba became unhealthy"
              docker logs samba-test
              exit 1
            fi
            sleep 1
          done
          echo "Samba failed to start"
          docker logs samba-test
          exit 1

      - name: Smoke test - healthcheck credentials are not in argv
        run: |
          HEALTHCHECK=$(docker inspect -f '{{json .Config.Healthcheck.Test}}' samba-test)
          echo "$HEALTHCHECK"
          echo "$HEALTHCHECK" | grep -Eq -- '--password|SAMBA_PASSWORD' \
            && { echo "Healthcheck must not expose the Samba password in argv"; exit 1; }
          docker exec samba-test test -f /run/samba/healthcheck.auth
          MODE=$(docker exec samba-test stat -c '%a' /run/samba/healthcheck.auth)
          [ "$MODE" = "600" ] || { echo "Expected healthcheck credentials mode 600, got $MODE"; exit 1; }

      - name: Smoke test - list shares
        run: |
          OUTPUT=$(docker exec samba-test smbclient -N -L //127.0.0.1 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "public" || { echo "Share 'public' not found"; exit 1; }

      - name: Smoke test - write and read file
        run: |
          docker exec samba-test smbclient -U samba%test-password //127.0.0.1/public \
            -c 'put /etc/hostname test-file.txt' 2>&1
          OUTPUT=$(docker exec samba-test smbclient -U samba%test-password //127.0.0.1/public \
            -c 'ls' 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "test-file.txt" || { echo "File not found"; exit 1; }

      - name: Smoke test - verify file content
        run: |
          docker exec samba-test smbclient -U samba%test-password //127.0.0.1/public \
            -c 'get test-file.txt /tmp/downloaded.txt' 2>&1
          docker exec samba-test cat /tmp/downloaded.txt
          echo "File read/write OK"

      - name: Smoke test - veto files
        run: |
          PUT_OUTPUT=$(docker exec samba-test smbclient -U samba%test-password //127.0.0.1/public \
            -c 'put /etc/hostname .DS_Store' 2>&1 || true)
          echo "$PUT_OUTPUT"
          echo "$PUT_OUTPUT" | grep -q "NT_STATUS_OBJECT_NAME_NOT_FOUND" \
            || { echo "Expected vetoed file upload to be rejected"; exit 1; }
          OUTPUT=$(docker exec samba-test smbclient -U samba%test-password //127.0.0.1/public \
            -c 'ls' 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "\.DS_Store" && { echo "Veto file should not be visible"; exit 1; }
          echo "Veto files OK"

      - name: Smoke test - guest access denied
        run: |
          if docker exec samba-test smbclient -N //127.0.0.1/public -c 'ls' >/tmp/guest-output.txt 2>&1; then
            echo "Guest access should be denied"
            cat /tmp/guest-output.txt
            exit 1
          fi
          cat /tmp/guest-output.txt
          grep -Eqi "NT_STATUS_ACCESS_DENIED|Access denied|tree connect failed" /tmp/guest-output.txt \
            || { echo "Expected guest access denial message"; exit 1; }

      - name: Smoke test - optional services disabled by default
        run: |
          docker exec samba-test /command/s6-svstat /var/run/s6/legacy-services/wsdd 2>&1 | grep -q "^down" \
            && echo "wsdd: down (correct)" || { echo "wsdd should be down by default"; docker logs samba-test; exit 1; }
          docker exec samba-test /command/s6-svstat /var/run/s6/legacy-services/avahi 2>&1 | grep -q "^down" \
            && echo "avahi: down (correct)" || { echo "avahi should be down by default"; docker logs samba-test; exit 1; }

      - name: Smoke test - optional services start with wsdd2 config
        run: |
          docker compose -f docker-compose-test.yml down -v
          docker run -d --name samba-discovery \
            --cap-add CAP_NET_ADMIN \
            --cap-add CAP_NET_RAW \
            -e SAMBA_PASSWORD=test-password \
            -e WORKGROUP=TESTWG \
            -e WSDD2_ENABLE=1 \
            -e WSDD2_HOSTNAME=testhost \
            -e WSDD2_NETBIOS_NAME=TESTHOST \
            -e WSDD2_WORKGROUP=TESTWG \
            -e AVAHI_ENABLE=1 \
            -v samba-discovery-data:/share \
            local/samba:test
          sleep 5
          docker exec samba-discovery /command/s6-svstat /var/run/s6/legacy-services/wsdd 2>&1 | grep -q "^up" \
            && echo "wsdd: up (correct)" || { echo "wsdd not running"; docker logs samba-discovery; exit 1; }
          docker exec samba-discovery /command/s6-svstat /var/run/s6/legacy-services/avahi 2>&1 | grep -q "^up" \
            && echo "avahi: up (correct)" || { echo "avahi not running"; docker logs samba-discovery; exit 1; }
          DISCOVERY_LOGS=$(docker logs samba-discovery 2>&1)
          case "$DISCOVERY_LOGS" in
            *"Starting wsdd2 -H testhost -N TESTHOST -G TESTWG"*) ;;
            *) echo "wsdd2 did not start with expected arguments"; echo "$DISCOVERY_LOGS"; exit 1 ;;
          esac
          docker rm -f samba-discovery
          docker volume rm samba-discovery-data

      - name: Smoke test - guest access allowed with GUEST_OK
        run: |
          docker run -d --name samba-guest \
            -e GUEST_OK=1 \
            -v samba-guest-data:/share \
            local/samba:test
          sleep 3
          docker exec samba-guest smbclient -N //127.0.0.1/public -c 'ls' 2>&1 \
            || { echo "Guest access should be allowed"; docker logs samba-guest; exit 1; }
          docker exec samba-guest smbclient -N //127.0.0.1/public \
            -c 'put /etc/hostname guest-test.txt' 2>&1 \
            || { echo "Guest should be able to write"; docker logs samba-guest; exit 1; }
          echo "Guest access OK"
          docker rm -f samba-guest
          docker volume rm samba-guest-data

      - name: Smoke test - password file
        run: |
          cleanup() {
            docker rm -f samba-password-file >/dev/null 2>&1 || true
            docker volume rm samba-password-file-data >/dev/null 2>&1 || true
            rm -rf /tmp/samba-password-file-test
          }
          trap cleanup EXIT

          mkdir -p /tmp/samba-password-file-test
          printf '%s\n' 'file-password' > /tmp/samba-password-file-test/password

          docker run -d --name samba-password-file \
            -e SAMBA_PASSWORD_FILE=/run/secrets/samba_password \
            -v /tmp/samba-password-file-test/password:/run/secrets/samba_password:ro \
            -v samba-password-file-data:/share \
            local/samba:test

          for i in $(seq 1 30); do
            HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' samba-password-file)
            [ "$HEALTH" = "healthy" ] && break
            [ "$HEALTH" = "unhealthy" ] && { docker logs samba-password-file; exit 1; }
            sleep 1
          done
          [ "$HEALTH" = "healthy" ] || { docker logs samba-password-file; exit 1; }

          docker exec samba-password-file smbclient -U samba%file-password //127.0.0.1/public \
            -c 'put /etc/hostname password-file.txt' 2>&1
          docker exec samba-password-file test -f /run/samba/healthcheck.auth
          HEALTHCHECK=$(docker inspect -f '{{json .Config.Healthcheck.Test}}' samba-password-file)
          echo "$HEALTHCHECK" | grep -Eq -- '--password|SAMBA_PASSWORD' \
            && { echo "Healthcheck must not expose the Samba password in argv"; exit 1; }

      - name: Smoke test - multiline password fails fast
        run: |
          cleanup() {
            docker rm -f samba-multiline-password >/dev/null 2>&1 || true
            docker volume rm samba-multiline-password-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          MULTILINE_PASSWORD=$(printf 'bad\npassword')
          docker run -d --name samba-multiline-password \
            -e SAMBA_PASSWORD="${MULTILINE_PASSWORD}" \
            -v samba-multiline-password-data:/share \
            local/samba:test

          for i in $(seq 1 10); do
            STATUS=$(docker inspect -f '{{.State.Status}}' samba-multiline-password)
            [ "$STATUS" = "exited" ] && break
            sleep 1
          done
          [ "$STATUS" = "exited" ] || { echo "Container should exit on multiline SAMBA_PASSWORD"; docker logs samba-multiline-password; exit 1; }
          docker logs samba-multiline-password 2>&1 | grep -q "SAMBA_PASSWORD must not contain newlines" \
            || { echo "Expected multiline password startup error"; docker logs samba-multiline-password; exit 1; }

      - name: Smoke test - read-only share blocks writes
        run: |
          cleanup() {
            docker rm -f samba-readonly >/dev/null 2>&1 || true
            docker volume rm samba-readonly-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name samba-readonly \
            -e SAMBA_PASSWORD=test-password \
            -e READ_ONLY=1 \
            -v samba-readonly-data:/share \
            local/samba:test

          for i in $(seq 1 30); do
            HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' samba-readonly)
            [ "$HEALTH" = "healthy" ] && break
            [ "$HEALTH" = "unhealthy" ] && { docker logs samba-readonly; exit 1; }
            sleep 1
          done
          [ "$HEALTH" = "healthy" ] || { docker logs samba-readonly; exit 1; }

          docker exec samba-readonly smbclient -U samba%test-password //127.0.0.1/public -c 'ls' 2>&1
          if docker exec samba-readonly smbclient -U samba%test-password //127.0.0.1/public \
            -c 'put /etc/hostname readonly.txt' >/tmp/readonly-output.txt 2>&1; then
            echo "Read-only share should reject writes"
            cat /tmp/readonly-output.txt
            exit 1
          fi
          cat /tmp/readonly-output.txt
          grep -Eqi "NT_STATUS_ACCESS_DENIED|Access denied|NT_STATUS_MEDIA_WRITE_PROTECTED" /tmp/readonly-output.txt \
            || { echo "Expected write denial message"; exit 1; }

      - name: Smoke test - recycle bin and create masks
        run: |
          cleanup() {
            docker rm -f samba-options >/dev/null 2>&1 || true
            docker volume rm samba-options-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name samba-options \
            -e SAMBA_PASSWORD=test-password \
            -e RECYCLE_ENABLE=1 \
            -e RECYCLE_MAX_SIZE=1024 \
            -e RECYCLE_EXCLUDE='*.tmp|*.temp' \
            -e RECYCLE_EXCLUDE_DIR='.recycle|tmp' \
            -e CREATE_MASK=0640 \
            -e DIRECTORY_MASK=0750 \
            -v samba-options-data:/share \
            local/samba:test

          for i in $(seq 1 30); do
            HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' samba-options)
            [ "$HEALTH" = "healthy" ] && break
            [ "$HEALTH" = "unhealthy" ] && { docker logs samba-options; exit 1; }
            sleep 1
          done
          [ "$HEALTH" = "healthy" ] || { docker logs samba-options; exit 1; }

          docker exec samba-options smbclient -U samba%test-password //127.0.0.1/public \
            -c 'mkdir maskdir; put /etc/hostname maskdir/mask-file.txt' 2>&1

          DIR_MODE=$(docker exec samba-options stat -c '%a' /share/maskdir)
          FILE_MODE=$(docker exec samba-options stat -c '%a' /share/maskdir/mask-file.txt)
          [ "$DIR_MODE" = "750" ] || { echo "Expected directory mode 750, got $DIR_MODE"; exit 1; }
          [ "$FILE_MODE" = "640" ] || { echo "Expected file mode 640, got $FILE_MODE"; exit 1; }
          CONFIG=$(docker exec samba-options testparm -s /etc/samba/smb.conf 2>/dev/null)
          echo "$CONFIG" | grep -Fq "recycle:maxsize = 1024" \
            || { echo "Expected recycle:maxsize in smb.conf"; docker logs samba-options; exit 1; }
          echo "$CONFIG" | grep -Fq "recycle:exclude = *.tmp|*.temp" \
            || { echo "Expected recycle:exclude in smb.conf"; docker logs samba-options; exit 1; }
          echo "$CONFIG" | grep -Fq "recycle:exclude_dir = .recycle|tmp" \
            || { echo "Expected recycle:exclude_dir in smb.conf"; docker logs samba-options; exit 1; }

          docker exec samba-options smbclient -U samba%test-password //127.0.0.1/public \
            -c 'del maskdir/mask-file.txt' 2>&1
          docker exec samba-options test -f /share/.recycle/maskdir/mask-file.txt

      - name: Smoke test - invalid UID/GID fails fast
        run: |
          docker run -d --name samba-invalid \
            -e FORCE_USER_UID=0 \
            -e FORCE_GROUP_GID=0 \
            local/samba:test
          for i in $(seq 1 10); do
            STATUS=$(docker inspect -f '{{.State.Status}}' samba-invalid)
            [ "$STATUS" = "exited" ] && break
            sleep 1
          done
          echo "container status: $STATUS"
          [ "$STATUS" = "exited" ] || { echo "Container should exit on invalid UID/GID"; docker logs samba-invalid; exit 1; }
          docker logs samba-invalid 2>&1 | grep -Eq "FORCE_USER_UID|FORCE_GROUP_GID|Group samba already exists|User samba already exists" \
            || { echo "Expected a clear startup error"; docker logs samba-invalid; exit 1; }
          docker rm -f samba-invalid >/dev/null 2>&1 || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose-test.yml down -v

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/samba"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=samba-image
          cache-to: type=gha,mode=max,scope=samba-image,ignore-error=true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.image }}:latest
